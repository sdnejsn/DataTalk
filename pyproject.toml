[project]
name = "datatalk"
version = "0.1.0"
description = "Natural language data analysis with multi-provider tool calling and local execution."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.66,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
datatalk = "datatalk.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datatalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
